# Build the two immutable Edge OS images for the Coolify deployment, on manual dispatch only.
#
# The worker does not run this workflow. It prepares the file and verifies the Dockerfiles with a local dry build.
# A run needs two repository variables (they are public values, never secrets):
#   NEXT_PUBLIC_API_BASE_URL  e.g. https://api.edgeos.fun
#   NEXT_PUBLIC_PRIVY_APP_ID  the Privy application id
# The digests artifact is the deployment input for compose.coolify.yml. Deploy by digest, never by tag.

name: Build deployment images

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  API_IMAGE: ghcr.io/edge-os-app/edge-os-api
  WEB_IMAGE: ghcr.io/edge-os-app/edge-os-web

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the exact source
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Require the public build values
        env:
          NEXT_PUBLIC_API_BASE_URL: ${{ vars.NEXT_PUBLIC_API_BASE_URL }}
          NEXT_PUBLIC_PRIVY_APP_ID: ${{ vars.NEXT_PUBLIC_PRIVY_APP_ID }}
        run: |
          test -n "$NEXT_PUBLIC_API_BASE_URL" || { echo "repository variable NEXT_PUBLIC_API_BASE_URL is required" >&2; exit 1; }
          test -n "$NEXT_PUBLIC_PRIVY_APP_ID" || { echo "repository variable NEXT_PUBLIC_PRIVY_APP_ID is required" >&2; exit 1; }

      - name: Build and push the API image
        id: api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/api.Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.API_IMAGE }}:${{ github.sha }}
          build-args: |
            EDGE_OS_PROFILE=PRODUCTION
            EDGE_OS_SOURCE_COMMIT=${{ github.sha }}

      - name: Build and push the web image
        id: web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.WEB_IMAGE }}:${{ github.sha }}
          build-args: |
            EDGE_OS_PROFILE=PRODUCTION
            EDGE_OS_SOURCE_COMMIT=${{ github.sha }}
            NEXT_PUBLIC_API_BASE_URL=${{ vars.NEXT_PUBLIC_API_BASE_URL }}
            NEXT_PUBLIC_PRIVY_APP_ID=${{ vars.NEXT_PUBLIC_PRIVY_APP_ID }}

      - name: Record the image digests
        env:
          API_DIGEST: ${{ steps.api.outputs.digest }}
          WEB_DIGEST: ${{ steps.web.outputs.digest }}
        run: |
          test -n "$API_DIGEST" || { echo "the API build returned no digest" >&2; exit 1; }
          test -n "$WEB_DIGEST" || { echo "the web build returned no digest" >&2; exit 1; }
          mkdir -p digests
          printf '%s\n' "$API_DIGEST" > digests/api.digest
          printf '%s\n' "$WEB_DIGEST" > digests/web.digest
          printf '{\n  "api": "%s",\n  "web": "%s"\n}\n' "$API_DIGEST" "$WEB_DIGEST" > digests/image-digests.json

      - name: Upload the digests
        uses: actions/upload-artifact@v4
        with:
          name: image-digests
          path: digests/
          if-no-files-found: error
