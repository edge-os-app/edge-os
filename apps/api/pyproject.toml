[project]
name = "edge-os-api"
version = "0.1.0"
description = "Edge OS API: authenticated first Research path (P03)"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi==0.142.2",
    "uvicorn==0.54.0",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "pyjwt[crypto]==2.15.1",
    "sqlalchemy==2.0.54",
    "alembic==1.20.0",
    "psycopg[binary]==3.3.6",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "httpx==0.28.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/edge_os_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "../../scripts/p03"]
addopts = "-ra"
