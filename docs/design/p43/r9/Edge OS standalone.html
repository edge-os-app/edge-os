ign:right\">8 / 30<\u002Fspan><div aria-hidden=\"true\" style=\"grid-column:1 / -1;height:12px;border-radius:999px;background:var(--color-neutral-100)\"><div style=\"width:26.7%;height:100%;border-radius:999px;background:var(--color-accent-2-600)\"><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n              <div style=\"display:grid;grid-template-columns:minmax(0,1fr) 64px;gap:4px 12px;align-items:center\"><span>3 · Rise greater than 1% in 15 minutes<\u002Fspan><span style=\"font-weight:700;text-align:right\">14 / 30<\u002Fspan><div aria-hidden=\"true\" style=\"grid-column:1 / -1;height:12px;border-radius:999px;background:var(--color-neutral-100)\"><div style=\"width:46.7%;height:100%;border-radius:999px;background:var(--color-accent-2-600)\"><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n              <div style=\"display:grid;grid-template-columns:minmax(0,1fr) 64px;gap:4px 12px;align-items:center\"><span>4 · Rise greater than 2% in 15 minutes<\u002Fspan><span style=\"font-weight:700;text-align:right\">8 / 30<\u002Fspan><div aria-hidden=\"true\" style=\"grid-column:1 / -1;height:12px;border-radius:999px;background:var(--color-neutral-100)\"><div style=\"width:26.7%;height:100%;border-radius:999px;background:var(--color-accent-2-600)\"><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:8px;font-size:15px\">\n            <p style=\"margin:0\">These calculations compare past price changes. Real trading profit remains unknown. This result applies to the study; another period could give a different result.<\u002Fp>\n            <p style=\"margin:0\">Other trading rules need their own review, execution checks and permission. This study does not decide whether a separate strategy may trade.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;border-top:1px solid var(--color-divider)\">\n            <details style=\"border-bottom:1px solid var(--color-divider);padding:14px 0\"><summary style=\"font-size:16px;font-weight:700\">Compare all four versions<\u002Fsummary>\n              <div style=\"display:flex;flex-direction:column;gap:10px;padding-top:12px;font-size:15px\">\n                <p style=\"margin:0\">Each version would buy after a price rise, then look at the next 30 minutes. Counts compare times with that rise against times without it.<\u002Fp>\n                <div style=\"display:flex;flex-direction:column;gap:0;border:1px solid var(--color-neutral-400);border-radius:18px;overflow:hidden\">\n                  <div style=\"padding:12px 16px;border-bottom:1px solid var(--color-divider);display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:6px 14px\"><strong style=\"grid-column:1 / -1\">1 · Rise greater than 1% in 5 minutes<\u002Fstrong><span><span style=\"display:block;font-size:12px;color:var(--color-neutral-800)\">First period: counts and difference<\u002Fspan>13 / 21 · +3.4506%<\u002Fspan><span><span style=\"display:block;font-size:12px;color:var(--color-neutral-800)\">Later period: counts and difference<\u002Fspan>10 / 37 · −0.2978%<\u002Fspan><span><span style=\"display:block;font-size:12px;color:var(--color-neutral-800)\">Later average after assumed costs<\u002Fspan>−1.0127%<\u002Fspan><span><span style=\"display:block;font-size:12px;color:var(--color-neutral-800)\">Enough examples?<\u002Fspan>No<\u002Fspan><\u002Fdiv>\n                  <div style=\"padding:12px 16px;border-bottom:1px solid var(--color-divider);display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:6px 14px\"><strong style=\"grid-column:1 / -1\">2 · Rise greater than 2% in 5 minutes<\u002Fstrong><span><span style=\"display:block;font-size:12px;color:var(--color-neutral-800)\">First period: counts and difference<\u002Fspan>8 / 26 · +5.9342%<\u002Fspan><span><span style=\"display:block;font-size:12px;color:var(--color-neutral-800)\">Later period: counts and difference<\u002Fspan>8 / 39 · +0.3835%<\u002Fspan><span><span style=\"display:block;font-size:12px;color:var(--color-neutral-800)\">Later average after assumed costs<\u002Fspan>−0.4628%<\u002Fspan><span><span style=\"display:block;font-size:12px;color:var(--color-neutral-800)\">Enough examples?<\u002Fspan>No<\u002Fspan><\u002Fdiv>\n                  <div style=\"padding:12px 16px;border-bottom:1px solid var(--color-divider);display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:6px 14px\"><strong style=\"grid-column:1 / -1\">3 · Rise greater than 1% in 15 minutes<\u002Fstrong><span><span style=\"display:block;font-size:12px;color:var(--color-neutral-800)\">First period: counts and difference<\u002Fspan>13 / 21 · +0.4436%<\u002Fspan><span><span style=\"display:block;font-size:12px;color:var(--color-neutral-800)\">Later period: counts and difference<\u002Fspan>14 / 33 · −0.5948%<\u002Fspan><span><span style=\"display:block;font-size:12px;color:var(--color-neutral-800)\">Later average after assumed costs<\u002Fspan>−1.1949%<\u002Fspan><span><span style=\"display:block;font-size:12px;color:var(--color-neutral-800)\">Enough examples?<\u002Fspan>No<\u002Fspan><\u002Fdiv>\n                  <div style=\"padding:12px 16px;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:6px 14px\"><strong style=\"grid-column:1 / -1\">4 · Rise greater than 2% in 15 minutes<\u002Fstrong><span><span style=\"display:block;font-size:12px;color:var(--color-neutral-800)\">First period: counts and difference<\u002Fspan>11 / 23 · +2.5145%<\u002Fspan><span><span style=\"display:block;font-size:12px;color:var(--color-neutral-800)\">Later period: counts and difference<\u002Fspan>8 / 39 · +0.1424%<\u002Fspan><span><span style=\"display:block;font-size:12px;color:var(--color-neutral-800)\">Later average after assumed costs<\u002Fspan>−0.6618%<\u002Fspan><span><span style=\"display:block;font-size:12px;color:var(--color-neutral-800)\">Enough examples?<\u002Fspan>No<\u002Fspan><\u002Fdiv>\n                <\u002Fdiv>\n                <p style=\"margin:0;font-size:14px\">For example, 13 / 21 means 13 times with the rise and 21 without. A positive difference means the first group did better on average. A negative difference means it did worse. Differences are before costs, with an assumed three-minute data delay.<\u002Fp>\n                <p style=\"margin:0;font-size:14px\">The last result assumes a cost of 0.5% to buy and 0.5% to sell. These costs were assumed, not measured from real trades.<\u002Fp>\n              <\u002Fdiv>\n            <\u002Fdetails>\n            <details style=\"border-bottom:1px solid var(--color-divider);padding:14px 0\"><summary style=\"font-size:16px;font-weight:700\">Why the early results were not enough<\u002Fsummary>\n              <ul style=\"margin:10px 0 0;padding-left:22px;display:flex;flex-direction:column;gap:6px;font-size:15px\">\n                <li>The later two-day period had at most 48 hourly opportunities. The agreed test needed at least 30 with the rise and 30 without. It could not meet that requirement, which was kept unchanged.<\u002Fli>\n                <li>Versions 1 and 3 looked better in the first period but worse in the later period. Versions 2 and 4 were slightly better before costs in the later period, with too few examples to support choosing either.<\u002Fli>\n                <li>All four later averages were negative after either assumed cost: 0.5% or 1% for each buy and sale.<\u002Fli>\n                <li>Much of the early gain came from September 25. All four versions had a negative total price result on September 27. The middle result in both 15-minute versions was also negative in the first period.<\u002Fli>\n              <\u002Ful>\n            <\u002Fdetails>\n            <details style=\"border-bottom:1px solid var(--color-divider);padding:14px 0\"><summary style=\"font-size:16px;font-weight:700\">How the study was done<\u002Fsummary>\n              <div style=\"padding-top:10px;font-size:15px;display:flex;flex-direction:column;gap:8px\">\n                <ol style=\"margin:0;padding-left:22px;display:flex;flex-direction:column;gap:4px\"><li>Explore the idea using September 25 to 28 prices.<\u002Fli><li>Check the same rules again on September 28 to 30 prices.<\u002Fli><li>Keep September 30 to October 2 data unopened for an independent final check. No supported strategy was selected to use it.<\u002Fli><\u002Fol>\n                <p style=\"margin:0\">We compare times with the required rise against times without it. For a rule requiring more than a 1% rise, a 2% rise qualifies; a 0.5% rise does not. These are explanations of the rule, not added study results.<\u002Fp>\n                <p style=\"margin:0\">Then we compare the price changes over the next 30 minutes. The calculations do not show actual trading profits.<\u002Fp>\n              <\u002Fdiv>\n            <\u002Fdetails>\n            <details style=\"border-bottom:1px solid var(--color-divider);padding:14px 0\"><summary style=\"font-size:16px;font-weight:700\">Data sources, missing prices and cost assumptions<\u002Fsummary>\n              <dl style=\"margin:12px 0 0;display:flex;flex-direction:column;gap:10px;font-size:15px\">\n                <div><dt style=\"font-weight:700\">Source<\u002Fdt><dd style=\"margin:0\">Recorded MOE/WMON study using 26,146 decoded buys and sales, collected October 3. Choosing a currently active market can overlook markets that failed or disappeared. Complete archive coverage and when trades became final remain unverified.<\u002Fdd><\u002Fdiv>\n                <div><dt style=\"font-weight:700\">Missing prices<\u002Fdt><dd style=\"margin:0\">First period: 34 of 72 opportunities usable. 24 entry prices and 20 exit prices were missing, with 6 missing both. Later period: 47 usable outcomes and 1 missing entry. A missing exit blocks later paper entries until it is resolved.<\u002Fdd><\u002Fdiv>\n                <div><dt style=\"font-weight:700\">When data could be used<\u002Fdt><dd style=\"margin:0\">An assumed 180-second delay starts after the trade or price interval ends, whichever is later. Original delivery and finality times are unknown. A 60-second delay gave the same results, but that is not an independent repeat.<\u002Fdd><\u002Fdiv>\n                <div><dt style=\"font-weight:700\">Longer delay<\u002Fdt><dd style=\"margin:0\">At a 600-second delay, every opportunity failed because the information would arrive after the decision. These rejected cases do not count as zero returns.<\u002Fdd><\u002Fdiv>\n                <div><dt style=\"font-weight:700\">Costs included<\u002Fdt><dd style=\"margin:0\">Assumed costs of 0%, 0.5% or 1% for each buy and sale. Actual fees were not measured.<\u002Fdd><\u002Fdiv>\n                <div><dt style=\"font-weight:700\">Costs left out<\u002Fdt><dd style=\"margin:0\">Token transfer charges and balance changes, wrapping, trade routing, MON network fees, price impact and how much could actually be traded. The study cannot establish real profitability.<\u002Fdd><\u002Fdiv>\n                <div><dt style=\"font-weight:700\">Rules and research record<\u002Fdt><dd style=\"margin:0\">Four rule templates were checked and reloaded using a test compiler. They are not deployable MOE strategies. The recorded study used one hypothesis, four proposals and 24 evaluations, including two real Hermes conversations. No live conversation runs here.<\u002Fdd><\u002Fdiv>\n              <\u002Fdl>\n            <\u002Fdetails>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ R.repLp }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"max-width:780px;display:flex;flex-direction:column;gap:22px\">\n          <div style=\"display:flex;flex-direction:column;gap:8px\">\n            <span style=\"display:flex;gap:6px;flex-wrap:wrap\"><span class=\"tag tag-accent\" style=\"border:1px solid var(--color-accent-700);font-size:13px\">Illustrative example · not a real study<\u002Fspan><span class=\"tag tag-neutral\" style=\"border:1px solid var(--color-neutral-500)\">LP research · later slice · not live<\u002Fspan><\u002Fspan>\n            <h2 id=\"page-title\" tabindex=\"-1\" style=\"margin:0;font-size:28px\">Would providing MOE/WMON liquidity beat holding?<\u002Fh2>\n            <p style=\"margin:0;font-size:15px;color:var(--color-neutral-800)\">One declared pool: an example MOE/WMON pool on Monad. Example period Sep 1 – 21, 2026. Compared with holding the same starting MOE and WMON.<\u002Fp>\n          <\u002Fdiv>\n          <dl style=\"margin:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));border:1px solid var(--color-neutral-400);border-radius:22px;overflow:hidden;background:var(--color-neutral-100)\">\n            <sc-for list=\"{{ LP.facts }}\" as=\"lf\" hint-placeholder-count=\"3\"><div style=\"padding:14px 18px;display:flex;flex-direction:column;gap:2px;border-bottom:1px solid var(--color-divider)\"><dt style=\"font-size:13px;color:var(--color-neutral-800)\">{{ lf.k }}<\u002Fdt><dd style=\"margin:0;font-size:15px;font-weight:700\">{{ lf.v }}<\u002Fdd><\u002Fdiv><\u002Fsc-for>\n          <\u002Fdl>\n          <p style=\"margin:0;font-size:22px;line-height:1.35;font-weight:700\">Unresolved in this example: fee income looked larger than holding, but missing fee history for 4 days means the net comparison can’t be decided.<\u002Fp>\n          <div style=\"display:flex;flex-direction:column;gap:10px;padding:20px 22px;border-radius:24px;background:var(--color-surface)\">\n            <span style=\"font-size:16px;font-weight:700\">Cost breakdown against holding (example, WMON-equivalent)<\u002Fspan>\n            <div style=\"display:flex;flex-direction:column;border:1px solid var(--color-neutral-400);border-radius:18px;overflow:hidden;background:var(--color-neutral-100)\">\n              <sc-for list=\"{{ LP.costs }}\" as=\"lc\" hint-placeholder-count=\"6\"><div style=\"display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 16px;padding:10px 16px;border-bottom:1px solid var(--color-divider);font-size:15px\"><span style=\"display:flex;flex-direction:column\"><strong>{{ lc.k }}<\u002Fstrong><span style=\"font-size:13px;color:var(--color-neutral-800)\">{{ lc.note }}<\u002Fspan><\u002Fspan><span style=\"font-weight:700;text-align:right\">{{ lc.v }}<\u002Fspan><\u002Fdiv><\u002Fsc-for>\n            <\u002Fdiv>\n            <span style=\"font-size:13px\">Gross fees aren’t profit. Inventory change and impermanent loss are shown separately from fees, and gas and rebalancing costs are separate again. Net stays unresolved while history is missing.<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;border-top:1px solid var(--color-divider)\">\n            <sc-for list=\"{{ LP.sections }}\" as=\"ls\" hint-placeholder-count=\"5\"><details style=\"border-bottom:1px solid var(--color-divider);padding:14px 0\"><summary style=\"font-size:16px;font-weight:700\">{{ ls.title }}<\u002Fsummary><ul style=\"margin:10px 0 0;padding-left:22px;display:flex;flex-direction:column;gap:6px;font-size:15px\"><sc-for list=\"{{ ls.items }}\" as=\"li2\"><li>{{ li2.t }}<\u002Fli><\u002Fsc-for><\u002Ful><\u002Fdetails><\u002Fsc-for>\n          <\u002Fdiv>\n          <p role=\"note\" style=\"margin:0;padding:12px 16px;border-radius:18px;background:var(--color-accent-100);color:var(--color-accent-900);font-size:15px;font-weight:600\">Exact LP rules aren’t available: the qualified LP rule profile isn’t defined yet, so no executable add, remove, rebalance or collect rules are shown. There is no live LP action, and spot trading permission doesn’t qualify LP.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ R.repIll }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"max-width:780px;display:flex;flex-direction:column;gap:22px\">\n          <div style=\"display:flex;flex-direction:column;gap:8px\">\n            <span class=\"tag tag-accent\" style=\"align-self:flex-start;border:1px solid var(--color-accent-700);font-size:13px\">Illustrative example · not a real study<\u002Fspan>\n            <h2 id=\"page-title\" tabindex=\"-1\" style=\"margin:0;font-size:28px\">{{ I.title }}<\u002Fh2>\n            <p style=\"margin:0;font-size:15px;color:var(--color-neutral-800)\">{{ I.scope }}<\u002Fp>\n            <p style=\"margin:0;font-size:14px;font-weight:600\">{{ I.definition }}<\u002Fp>\n          <\u002Fdiv>\n          <dl style=\"margin:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));border:1px solid var(--color-neutral-400);border-radius:22px;overflow:hidden;background:var(--color-neutral-100)\">\n            <sc-for list=\"{{ I.facts }}\" as=\"fa\" hint-placeholder-count=\"3\"><div style=\"padding:14px 18px;display:flex;flex-direction:column;gap:2px;border-bottom:1px solid var(--color-divider)\"><dt style=\"font-size:13px;color:var(--color-neutral-800)\">{{ fa.k }}<\u002Fdt><dd style=\"margin:0;font-size:15px;font-weight:700\">{{ fa.v }}<\u002Fdd><\u002Fdiv><\u002Fsc-for>\n          <\u002Fdl>\n          <p style=\"margin:0;font-size:22px;line-height:1.35;font-weight:700\">{{ I.conclusion }}<\u002Fp>\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px\">\n            <div style=\"display:flex;flex-direction:column;gap:8px;padding:18px 20px;border-radius:24px;background:var(--color-neutral-100);border:1px solid var(--color-divider)\"><h3 style=\"margin:0;font-size:17px;font-family:var(--font-body);font-weight:700\">{{ I.forHead }}<\u002Fh3><ul style=\"margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:15px\"><sc-for list=\"{{ I.forList }}\" as=\"fl\"><li>{{ fl.t }}<\u002Fli><\u002Fsc-for><\u002Ful><\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:8px;padding:18px 20px;border-radius:24px;background:var(--color-neutral-100);border:1px solid var(--color-divider)\"><h3 style=\"margin:0;font-size:17px;font-family:var(--font-body);font-weight:700\">{{ I.againstHead }}<\u002Fh3><ul style=\"margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:15px\"><sc-for list=\"{{ I.againstList }}\" as=\"al\"><li>{{ al.t }}<\u002Fli><\u002Fsc-for><\u002Ful><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;gap:10px;flex-wrap:wrap\">\n            <sc-for list=\"{{ I.nexts }}\" as=\"nx\" hint-placeholder-count=\"3\"><sc-if value=\"{{ nx.primary }}\"><button type=\"button\" class=\"btn btn-primary\" sc-camel-on-click=\"{{ nx.onClick }}\">{{ nx.label }}<\u002Fbutton><\u002Fsc-if><sc-if value=\"{{ nx.notPrimary }}\"><button type=\"button\" class=\"btn btn-secondary\" sc-camel-on-click=\"{{ nx.onClick }}\">{{ nx.label }}<\u002Fbutton><\u002Fsc-if><\u002Fsc-for>\n          <\u002Fdiv>\n          <sc-if value=\"{{ I.isTrade }}\"><p style=\"margin:-8px 0 0;font-size:14px;color:var(--color-neutral-800)\">{{ I.saveNote }}<\u002Fp><\u002Fsc-if>\n          <div style=\"display:flex;flex-direction:column;gap:12px;padding:20px 22px;border-radius:24px;background:var(--color-surface)\">\n            <span style=\"font-size:16px;font-weight:700\">{{ I.chartTitle }}<\u002Fspan>\n            <sc-if value=\"{{ I.isToken }}\">\n              <div style=\"position:relative;height:200px;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;align-items:end;padding-top:8px\">\n                <sc-if value=\"{{ I.showLine }}\"><div aria-hidden=\"true\" style=\"position:absolute;left:0;right:0;bottom:calc(25% + 22px);border-top:2px dashed var(--color-accent-800)\"><\u002Fdiv><span style=\"position:absolute;right:0;bottom:calc(25% + 26px);font-size:12px;font-weight:700;color:var(--color-accent-800);background:var(--color-surface);padding:0 4px\">{{ I.lineLabel }}<\u002Fspan><\u002Fsc-if>\n                <sc-for list=\"{{ I.bars }}\" as=\"br\" hint-placeholder-count=\"7\"><div style=\"display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end\"><span style=\"font-size:12px;font-weight:700\">{{ br.val }}<\u002Fspan><div style=\"width:100%;max-width:44px;height:{{ br.h }};border-radius:12px 12px 4px 4px;background:{{ br.color }}\"><\u002Fdiv><span style=\"font-size:12px\">{{ br.day }}<\u002Fspan><\u002Fdiv><\u002Fsc-for>\n              <\u002Fdiv>\n              <span style=\"font-size:13px\">WMON held in the pool at the end of each day. Bars in terracotta are below your threshold.<\u002Fspan>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ I.isTrade }}\">\n              <sc-for list=\"{{ I.counts }}\" as=\"cn\" hint-placeholder-count=\"2\"><div style=\"display:grid;grid-template-columns:minmax(0,1fr) 64px;gap:4px 12px;font-size:14px\"><span>{{ cn.label }}<\u002Fspan><span style=\"font-weight:700;text-align:right\">{{ cn.n }}<\u002Fspan><div aria-hidden=\"true\" style=\"grid-column:1 / -1;height:12px;border-radius:999px;background:var(--color-neutral-100)\"><div style=\"width:{{ cn.w }};height:100%;border-radius:999px;background:var(--color-accent-2-600)\"><\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fsc-for>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n          <p style=\"margin:0;font-size:15px\">{{ I.bigNote }}<\u002Fp>\n          <div style=\"display:flex;flex-direction:column;border-top:1px solid var(--color-divider)\">\n            <details style=\"border-bottom:1px solid var(--color-divider);padding:14px 0\"><summary style=\"font-size:16px;font-weight:700\">Sources<\u002Fsummary><ul style=\"margin:10px 0 0;padding-left:22px;display:flex;flex-direction:column;gap:6px;font-size:15px\"><sc-for list=\"{{ I.sources }}\" as=\"so\"><li>{{ so.t }}<\u002Fli><\u002Fsc-for><\u002Ful><\u002Fdetails>\n            <details style=\"border-bottom:1px solid var(--color-divider);padding:14px 0\"><summary style=\"font-size:16px;font-weight:700\">Missing information<\u002Fsummary><ul style=\"margin:10px 0 0;padding-left:22px;display:flex;flex-direction:column;gap:6px;font-size:15px\"><sc-for list=\"{{ I.missing }}\" as=\"mi\"><li>{{ mi.t }}<\u002Fli><\u002Fsc-for><\u002Ful><\u002Fdetails>\n            <details style=\"border-bottom:1px solid var(--color-divider);padding:14px 0\"><summary style=\"font-size:16px;font-weight:700\">How the study was done<\u002Fsummary><ol style=\"margin:10px 0 0;padding-left:22px;display:flex;flex-direction:column;gap:6px;font-size:15px\"><sc-for list=\"{{ I.method }}\" as=\"me\"><li>{{ me.t }}<\u002Fli><\u002Fsc-for><\u002Fol><\u002Fdetails>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ AL.show }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"max-width:860px;display:flex;flex-direction:column;gap:26px\">\n          <div style=\"display:flex;flex-direction:column;gap:6px\">\n            <h2 id=\"page-title\" tabindex=\"-1\" style=\"margin:0;font-size:30px\">Agents<\u002Fh2>\n            <p style=\"margin:0;font-size:16px;color:var(--color-neutral-800);max-width:660px\">Each agent has its own wallet, funds and trading permission. Adding funds never starts trading. Stopping one agent leaves the others as they are.<\u002Fp>\n          <\u002Fdiv>\n          <sc-if value=\"{{ AL.none }}\"><div style=\"padding:22px 24px;border-radius:26px;border:1px dashed var(--color-neutral-600);display:flex;flex-direction:column;gap:6px\"><strong style=\"font-size:17px\">No agents yet<\u002Fstrong><span style=\"font-size:15px\">Create one from a rule below. Creating an agent sets up its own wallet. It can’t trade until you fund it and approve its permission.<\u002Fspan><\u002Fdiv><\u002Fsc-if>\n          <div style=\"display:flex;flex-direction:column;gap:12px\">\n            <sc-for list=\"{{ AL.agents }}\" as=\"a\" hint-placeholder-count=\"3\">\n              <button type=\"button\" sc-camel-on-click=\"{{ a.onClick }}\" style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px 18px;text-align:left;padding:18px 22px;border-radius:26px;border:1px solid var(--color-neutral-400);background:var(--color-neutral-100);font-family:var(--font-body);color:var(--color-text);cursor:pointer\" style-hover=\"border-color:var(--color-accent-700)\">\n                <span style=\"grid-column:1 / -1;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:baseline\"><strong style=\"font-size:18px\">{{ a.name }}<\u002Fstrong><span style=\"font-size:15px\">{{ a.rule }}<\u002Fspan><span style=\"font-size:13px;color:var(--color-neutral-800)\">{{ a.address }} · Monad<\u002Fspan><\u002Fspan>\n                <span style=\"display:flex;flex-direction:column\"><span style=\"font-size:12px;color:var(--color-neutral-800)\">Wallet<\u002Fspan><span style=\"font-size:14px;font-weight:700\">{{ a.setup }}<\u002Fspan><\u002Fspan>\n                <span style=\"display:flex;flex-direction:column\"><span style=\"font-size:12px;color:var(--color-neutral-800)\">Permission<\u002Fspan><span style=\"font-size:14px;font-weight:700\">{{ a.perm }}<\u002Fspan><\u002Fspan>\n                <span style=\"display:flex;flex-direction:column\"><span style=\"font-size:12px;color:var(--color-neutral-800)\">Stop<\u002Fspan><span style=\"font-size:14px;font-weight:700\">{{ a.stop }}<\u002Fspan><\u002Fspan>\n                <span style=\"display:flex;flex-direction:column\"><span style=\"font-size:12px;color:var(--color-neutral-800)\">Open positions<\u002Fspan><span style=\"font-size:14px;font-weight:700\">{{ a.posCount }}<\u002Fspan><\u002Fspan>\n                <span style=\"grid-column:1 / -1;font-size:14px;color:var(--color-neutral-800)\">{{ a.health }}<\u002Fspan>\n              <\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:12px\">\n            <h3 style=\"margin:0;font-size:20px\">Saved rules<\u002Fh3>\n            <p style=\"margin:0;font-size:15px;color:var(--color-neutral-800)\">A rule describes when to buy and sell. It doesn’t trade by itself. Several agents can use the same rule, each with its own wallet.<\u002Fp>\n            <sc-for list=\"{{ AL.rules }}\" as=\"r\" hint-placeholder-count=\"2\">\n              <div style=\"display:flex;flex-direction:column;gap:8px;padding:18px 22px;border-radius:24px;background:var(--color-surface)\">\n                <div style=\"display:flex;gap:8px 12px;align-items:center;flex-wrap:wrap\"><strong style=\"font-size:17px\">{{ r.title }}<\u002Fstrong><span class=\"tag {{ r.cls }}\">{{ r.origin }}<\u002Fspan><\u002Fdiv>\n                <span style=\"font-size:15px\">{{ r.entry }} {{ r.exit }}<\u002Fspan>\n                <span style=\"font-size:14px;color:var(--color-neutral-800)\">Evidence: {{ r.evidence }}<\u002Fspan>\n                <sc-if value=\"{{ r.hasLineage }}\"><span style=\"font-size:14px;font-weight:600\">{{ r.lineage }}<\u002Fspan><\u002Fsc-if>\n                <sc-if value=\"{{ r.blocked }}\"><p role=\"note\" style=\"margin:0;padding:12px 16px;border-radius:18px;background:var(--color-accent-100);color:var(--color-accent-900);font-size:15px;font-weight:600\">{{ r.blockText }}<\u002Fp><\u002Fsc-if>\n                <div style=\"display:flex;gap:10px;flex-wrap:wrap\"><sc-if value=\"{{ r.hasChange }}\"><button type=\"button\" class=\"btn btn-primary\" sc-camel-on-click=\"{{ r.onChange }}\">Review a change to the rule<\u002Fbutton><\u002Fsc-if><sc-if value=\"{{ r.canEdit }}\"><button type=\"button\" class=\"btn btn-secondary\" sc-camel-on-click=\"{{ r.onEdit }}\">Review rule change<\u002Fbutton><\u002Fsc-if><button type=\"button\" class=\"btn btn-secondary\" sc-camel-on-click=\"{{ r.onCreate }}\">{{ r.btn }}<\u002Fbutton><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ AD.show }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"max-width:860px;display:flex;flex-direction:column;gap:22px\">\n          <div style=\"display:flex;flex-direction:column;gap:6px\">\n            <h2 id=\"page-title\" tabindex=\"-1\" style=\"margin:0;font-size:30px\">{{ AD.name }}<\u002Fh2>\n            <p style=\"margin:0;font-size:15px;color:var(--color-neutral-800)\">{{ AD.ruleTitle }} · MOE/WMON on Monad · own wallet {{ AD.address }}<\u002Fp>\n          <\u002Fdiv>\n          <dl style=\"margin:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));border:1px solid var(--color-neutral-400);border-radius:22px;overflow:hidden;background:var(--color-neutral-100)\">\n            <sc-for list=\"{{ AD.facts }}\" as=\"af\" hint-placeholder-count=\"4\"><div style=\"padding:12px 16px;display:flex;flex-direction:column;gap:2px;border-bottom:1px solid var(--color-divider)\"><dt style=\"font-size:13px;color:var(--color-neutral-800)\">{{ af.k }}<\u002Fdt><dd style=\"margin:0;font-size:15px;font-weight:700\">{{ af.v }}<\u002Fdd><\u002Fdiv><\u002Fsc-for>\n          <\u002Fdl>\n          <section aria-labelledby=\"ag-next\" style=\"display:flex;flex-direction:column;gap:10px;padding:18px 22px;border-radius:24px;border:2px solid {{ AD.nextBorder }};background:var(--color-neutral-100)\">\n            <h3 id=\"ag-next\" style=\"margin:0;font-size:17px;font-family:var(--font-body);font-weight:700\">{{ AD.nextTitle }}<\u002Fh3>\n            <p style=\"margin:0;font-size:15px\">{{ AD.nextText }}<\u002Fp>\n            <sc-if value=\"{{ AD.hasControls }}\"><div style=\"display:flex;gap:10px;flex-wrap:wrap\">\n              <sc-for list=\"{{ AD.controls }}\" as=\"ct\" hint-placeholder-count=\"1\"><sc-if value=\"{{ ct.primary }}\"><button type=\"button\" class=\"btn btn-primary\" sc-camel-on-click=\"{{ ct.onClick }}\">{{ ct.label }}<\u002Fbutton><\u002Fsc-if><sc-if value=\"{{ ct.notPrimary }}\"><button type=\"button\" class=\"btn btn-secondary\" sc-camel-on-click=\"{{ ct.onClick }}\">{{ ct.label }}<\u002Fbutton><\u002Fsc-if><\u002Fsc-for>\n            <\u002Fdiv><\u002Fsc-if>\n          <\u002Fsection>\n          <div role=\"group\" aria-label=\"{{ AD.name }} sections\" style=\"display:flex;gap:6px;flex-wrap:wrap;padding:4px;border-radius:999px;background:var(--color-surface);align-self:flex-start;max-width:100%\">\n            <sc-for list=\"{{ AD.tabs }}\" as=\"tb\" hint-placeholder-count=\"4\"><button type=\"button\" aria-pressed=\"{{ tb.sel }}\" sc-camel-on-click=\"{{ tb.onClick }}\" style=\"min-height:42px;padding:8px 16px;border-radius:999px;border:0;background:{{ tb.bg }};font-family:var(--font-body);font-size:14px;font-weight:{{ tb.fw }};color:var(--color-text);cursor:pointer\">{{ tb.label }}<\u002Fbutton><\u002Fsc-for>\n          <\u002Fdiv>\n\n          <sc-if value=\"{{ AD.ov }}\">\n            <sc-if value=\"{{ AD.hasTrial }}\">\n              <section style=\"display:flex;flex-direction:column;gap:10px;padding:18px 22px;border-radius:24px;background:var(--color-neutral-100);border:1px solid var(--color-divider)\">\n                <div style=\"display:flex;gap:8px 12px;align-items:baseline;flex-wrap:wrap\"><h3 style=\"margin:0;font-size:18px\">Trial<\u002Fh3><span class=\"tag {{ AD.trialCls }}\">{{ AD.trialState }}<\u002Fspan><span class=\"tag tag-neutral\" style=\"border:1px solid var(--color-neutral-500)\">Demo<\u002Fspan><\u002Fdiv>\n                <dl style=\"margin:0;display:flex;flex-direction:column;gap:8px;font-size:15px\"><sc-for list=\"{{ AD.trialRows }}\" as=\"trw\"><div><dt style=\"font-size:13px;color:var(--color-neutral-800)\">{{ trw.k }}<\u002Fdt><dd style=\"margin:0;font-weight:600\">{{ trw.v }}<\u002Fdd><\u002Fdiv><\u002Fsc-for><\u002Fdl>\n                <details><summary style=\"font-size:15px;font-weight:700;min-height:32px\">Forward observations and proposed lessons<\u002Fsummary>\n                  <ul style=\"margin:8px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:14px\"><sc-for list=\"{{ AD.obs }}\" as=\"ob\"><li>{{ ob.t }}<\u002Fli><\u002Fsc-for><\u002Ful>\n                  <p style=\"margin:8px 0 0;font-size:14px\">Observations aren’t proof the rule is profitable. A suggested lesson changes nothing on its own.<\u002Fp>\n                  <p role=\"note\" style=\"margin:8px 0 0;padding:10px 14px;border-radius:16px;background:var(--color-neutral-200);font-size:14px\"><strong>Unsupported · can’t be adopted yet.<\u002Fstrong> Rules can’t express a minimum gap between buys. A checking schedule or a study’s observation period isn’t the same condition, so no rule change is offered for this lesson.<\u002Fp>\n                <\u002Fdetails>\n              <\u002Fsection>\n            <\u002Fsc-if>\n            <details open=\"{{ AD.stepsOpen }}\" style=\"padding:16px 22px;border-radius:26px;background:var(--color-neutral-100);border:1px solid var(--color-divider)\">\n              <summary style=\"font-size:16px;font-weight:700;min-height:32px\">From rule to running agent · {{ AD.stepsSummary }} <span class=\"tag tag-neutral\" style=\"border:1px solid var(--color-neutral-500);margin-left:6px\">Demo states<\u002Fspan><\u002Fsummary>\n              <ol style=\"margin:8px 0 0;padding:0;list-style:none;display:flex;flex-direction:column\">\n                <sc-for list=\"{{ AD.steps }}\" as=\"stp\" hint-placeholder-count=\"7\"><li style=\"display:grid;grid-template-columns:22px minmax(0,1fr);gap:4px 12px;padding:10px 0;border-bottom:1px solid var(--color-divider)\"><span aria-hidden=\"true\" style=\"width:16px;height:16px;margin-top:3px;border-radius:50%;background:{{ stp.dot }};border:2px solid {{ stp.ring }}\"><\u002Fspan><span style=\"display:flex;flex-direction:column;gap:2px\"><span style=\"display:flex;gap:8px;flex-wrap:wrap;align-items:baseline\"><strong style=\"font-size:15px\">{{ stp.label }}<\u002Fstrong><span style=\"font-size:13px;font-weight:700;color:{{ stp.stateColor }}\">{{ stp.state }}<\u002Fspan><\u002Fspan><span style=\"font-size:14px\">{{ stp.text }}<\u002Fspan><\u002Fspan><\u002Fli><\u002Fsc-for>\n              <\u002Fol>\n              <p style=\"margin:10px 0 0;font-size:14px;font-weight:600\">{{ AD.stepsNext }}<\u002Fp>\n            <\u002Fdetails>\n            <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px\">\n              <section style=\"display:flex;flex-direction:column;gap:10px;padding:20px 22px;border-radius:26px;background:var(--color-neutral-100);border:1px solid var(--color-divider)\">\n                <h3 style=\"margin:0;font-size:18px\">What it can do now<\u002Fh3>\n                <ul style=\"margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:15px\"><sc-for list=\"{{ AD.canDo }}\" as=\"cd\"><li>{{ cd.t }}<\u002Fli><\u002Fsc-for><\u002Ful>\n                <details><summary style=\"font-size:15px;font-weight:700;min-height:32px\">Exact rule<\u002Fsummary><dl style=\"margin:8px 0 0;display:flex;flex-direction:column;gap:8px;font-size:14px\"><sc-for list=\"{{ AD.ruleRows }}\" as=\"rr\"><div><dt style=\"font-weight:700\">{{ rr.k }}<\u002Fdt><dd style=\"margin:0\">{{ rr.v }}<\u002Fdd><\u002Fdiv><\u002Fsc-for><\u002Fdl><\u002Fdetails>\n              <\u002Fsection>\n              <section style=\"display:flex;flex-direction:column;gap:10px;padding:20px 22px;border-radius:26px;background:var(--color-neutral-100);border:1px solid var(--color-divider)\">\n                <h3 style=\"margin:0;font-size:18px\">What happened<\u002Fh3>\n                <dl style=\"margin:0;display:flex;flex-direction:column;gap:8px;font-size:15px\"><sc-for list=\"{{ AD.health }}\" as=\"hh\"><div><dt style=\"font-size:13px;color:var(--color-neutral-800)\">{{ hh.k }}<\u002Fdt><dd style=\"margin:0;font-weight:600\">{{ hh.v }}<\u002Fdd><\u002Fdiv><\u002Fsc-for><\u002Fdl>\n              <\u002Fsection>\n              <section style=\"display:flex;flex-direction:column;gap:10px;padding:20px 22px;border-radius:26px;background:var(--color-neutral-100);border:1px solid var(--color-divider)\">\n                <h3 style=\"margin:0;font-size:18px\">Trading results<\u002Fh3>\n                <dl style=\"margin:0;display:flex;flex-direction:column;gap:8px;font-size:15px\"><sc-for list=\"{{ AD.results }}\" as=\"rs\"><div><dt style=\"font-size:13px;color:var(--color-neutral-800)\">{{ rs.k }}<\u002Fdt><dd style=\"margin:0;font-weight:600\">{{ rs.v }}<\u002Fdd><\u002Fdiv><\u002Fsc-for><\u002Fdl>\n                <span style=\"font-size:13px;color:var(--color-neutral-800)\">Deposits and withdrawals are money moving, not profit. Missing prices or costs stay unknown, never zero. Illustrative figures.<\u002Fspan>\n              <\u002Fsection>\n              <section style=\"display:flex;flex-direction:column;gap:10px;padding:20px 22px;border-radius:26px;background:var(--color-neutral-100);border:1px solid var(--color-divider)\">\n                <h3 style=\"margin:0;font-size:18px\">Its wallet<\u002Fh3>\n                <dl style=\"margin:0;display:flex;flex-direction:column;gap:8px;font-size:15px\"><sc-for list=\"{{ AD.wallet }}\" as=\"wr\"><div><dt style=\"font-size:13px;color:var(--color-neutral-800)\">{{ wr.k }}<\u002Fdt><dd style=\"margin:0;font-weight:600\">{{ wr.v }}<\u002Fdd><\u002Fdiv><\u002Fsc-for><\u002Fdl>\n                <div style=\"display:flex;gap:8px;flex-wrap:wrap\"><button type=\"button\" class=\"btn btn-secondary\" sc-camel-on-click=\"{{ AD.onFund }}\" disabled=\"{{ AD.notReady }}\">Add funds<\u002Fbutton><button type=\"button\" class=\"btn btn-secondary\" sc-camel-on-click=\"{{ AD.onWithdraw }}\" disabled=\"{{ AD.notReady }}\">Withdraw to my wallet<\u002Fbutton><\u002Fdiv>\n              <\u002Fsection>\n            <\u002Fdiv>\n            <section style=\"display:flex;flex-direction:column;gap:12px;padding:20px 22px;border-radius:26px;background:var(--color-surface)\">\n              <h3 style=\"margin:0;font-size:18px\">Permission and stops<\u002Fh3>\n              <dl style=\"margin:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px 16px;font-size:15px\"><sc-for list=\"{{ AD.limits }}\" as=\"lm\"><div><dt style=\"font-size:13px;color:var(--color-neutral-800)\">{{ lm.k }}<\u002Fdt><dd style=\"margin:0;font-weight:700\">{{ lm.v }}<\u002Fdd><\u002Fdiv><\u002Fsc-for><\u002Fdl>\n              <sc-if value=\"{{ AD.hasRecord }}\"><div style=\"display:flex;flex-direction:column;gap:0\"><sc-for list=\"{{ AD.records }}\" as=\"pr\"><details style=\"border-top:1px solid var(--color-divider);padding-top:10px\"><summary style=\"font-size:15px;font-weight:700;min-height:32px\">{{ pr.recTitle }} · version {{ pr.recVer }}<\u002Fsummary><dl style=\"margin:8px 0 0;display:flex;flex-direction:column;font-size:14px\"><sc-for list=\"{{ pr.record }}\" as=\"rc\"><div style=\"display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:4px 14px;padding:8px 0;border-bottom:1px solid var(--color-divider)\"><dt style=\"font-weight:700\">{{ rc.k }}<\u002Fdt><dd style=\"margin:0\">{{ rc.v }}<\u002Fdd><\u002Fdiv><\u002Fsc-for><\u002Fdl><p style=\"margin:8px 0 0;font-size:13px\">Demo record. Amounts this demo doesn’t track are shown as unknown, not zero.<\u002Fp><\u002Fdetails><\u002Fsc-for><sc-if value=\"{{ AD.hasHistNote }}\"><p style=\"margin:6px 0 0;font-size:13px\">{{ AD.recCount }}. Each keeps the terms exactly as approved.<\u002Fp><\u002Fsc-if><\u002Fdiv><\u002Fsc-if>\n              <sc-if value=\"{{ AD.hasSecondary }}\"><details style=\"border-top:1px solid var(--color-divider);padding-top:10px\"><summary style=\"font-size:15px;font-weight:700;min-height:36px\">{{ AD.secondaryLabel }}<\u002Fsummary><div style=\"display:flex;gap:8px;flex-wrap:wrap;padding-top:10px\"><sc-for list=\"{{ AD.secondary }}\" as=\"sc2\"><button type=\"button\" class=\"btn btn-secondary\" sc-camel-on-click=\"{{ sc2.onClick }}\" style=\"font-size:14px\">{{ sc2.label }}<\u002Fbutton><\u002Fsc-for><\u002Fdiv><\u002Fdetails><\u002Fsc-if>\n            <\u002Fsection>\n            <section style=\"display:flex;flex-direction:column;gap:10px\">\n              <div style=\"display:flex;gap:8px 12px;align-items:baseline;flex-wrap:wrap\"><h3 style=\"margin:0;font-size:18px\">Activity<\u002Fh3><span class=\"tag tag-neutral\" style=\"border:1px solid var(--color-neutral-500)\">Demo activity · no real agent worker is running<\u002Fspan><\u002Fdiv>\n              <sc-if value=\"{{ AD.noActivity }}\"><span style=\"font-size:15px;color:var(--color-neutral-800)\">No trades or transfers yet.<\u002Fspan><\u002Fsc-if>\n              <sc-for list=\"{{ AD.activity }}\" as=\"av\"><div style=\"display:flex;flex-direction:column;gap:4px;padding:12px 16px;border-radius:18px;background:var(--color-neutral-100);border:2px solid {{ av.border }}\"><div style=\"display:flex;gap:8px;flex-wrap:wrap;align-items:center\"><strong style=\"font-size:15px\">{{ av.title }}<\u002Fstrong><span class=\"tag {{ av.cls }}\">{{ av.status }}<\u002Fspan><\u002Fdiv><span style=\"font-size:14px\">{{ av.timeline }}<\u002Fspan><sc-if value=\"{{ av.hasNote }}\"><span style=\"font-size:14px;font-weight:600;color:var(--color-accent-800)\">{{ av.note }}<\u002Fspan><\u002Fsc-if><div style=\"display:flex;gap:8px;flex-wrap:wrap\"><sc-if value=\"{{ av.hasPos }}\"><button type=\"button\" class=\"btn btn-ghost\" sc-camel-on-click=\"{{ av.openPos }}\" style=\"font-size:14px;min-height:40px\">Open {{ av.posLabel }}<\u002Fbutton><\u002Fsc-if><sc-if value=\"{{ av.canCancel }}\"><button type=\"button\" class=\"btn btn-secondary\" sc-camel-on-click=\"{{ av.onCancel }}\" style=\"font-size:14px;min-height:40px\">Cancel before sending<\u002Fbutton><\u002Fsc-if><\u002Fdiv><\u002Fdiv><\u002Fsc-for>\n            <\u002Fsection>\n            <details style=\"border-top:1px solid var(--color-divider);padding-top:12px\"><summary style=\"font-size:16px;font-weight:700\">Detailed record<\u002Fsummary><ol style=\"margin:10px 0 0;padding-left:22px;display:flex;flex-direction:column;gap:6px;font-size:14px\"><sc-for list=\"{{ AD.history }}\" as=\"hi\"><li>{{ hi.t }}<\u002Fli><\u002Fsc-for><\u002Fol><\u002Fdetails>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ AD.test }}\">\n            <div style=\"display:flex;flex-direction:column;gap:18px\">\n              <p style=\"margin:0;font-size:15px\">Testing on past prices is optional. It doesn’t predict results, and it doesn’t grant or block permission. Rule: {{ T.ruleText }}<\u002Fp>\n              <sc-if value=\"{{ T.settings }}\">\n                <form sc-camel-on-submit=\"{{ T.run }}\" style=\"display:flex;flex-direction:column;gap:16px;padding:20px 22px;border-radius:26px;background:var(--color-neutral-100);border:1px solid var(--color-divider)\">\n                  <h3 style=\"margin:0;font-size:18px\">Test settings<\u002Fh3>\n                  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px\">\n                    <div style=\"display:flex;flex-direction:column;gap:6px\"><label for=\"t-period\" style=\"font-size:14px;font-weight:700\">Past period<\u002Flabel><sc-raw-select id=\"t-period\" class=\"input\" value=\"{{ T.period }}\" sc-camel-on-change=\"{{ T.onPeriod }}\" style=\"min-height:46px;font-size:15px;background:var(--color-bg);border-color:var(--color-neutral-500)\"><option value=\"0\">Sep 1 – 7, 2026<\u002Foption><option value=\"1\">Sep 8 – 14, 2026<\u002Foption><\u002Fsc-raw-select><\u002Fdiv>\n                    <div style=\"display:flex;flex-direction:column;gap:6px\"><label for=\"t-start\" style=\"font-size:14px;font-weight:700\">Starting capital (WMON)<\u002Flabel><input id=\"t-start\" type=\"number\" min=\"1\" class=\"input\" value=\"{{ T.start }}\" sc-camel-on-change=\"{{ T.onStart }}\" style=\"min-height:46px;font-size:15px;background:var(--color-bg);border-color:var(--color-neutral-500)\"><\u002Fdiv>\n                    <div style=\"display:flex;flex-direction:column;gap:6px\"><label for=\"t-size\" style=\"font-size:14px;font-weight:700\">Amount per trade (WMON)<\u002Flabel><input id=\"t-size\" type=\"number\" min=\"1\" class=\"input\" value=\"{{ T.size }}\" sc-camel-on-change=\"{{ T.onSize }}\" style=\"min-height:46px;font-size:15px;background:var(--color-bg);border-color:var(--color-neutral-500)\"><\u002Fdiv>\n                    <div style=\"display:flex;flex-direction:column;gap:6px\"><label for=\"t-cost\" style=\"font-size:14px;font-weight:700\">Assumed trading cost<\u002Flabel><sc-raw-select id=\"t-cost\" class=\"input\" value=\"{{ T.cost }}\" sc-camel-on-change=\"{{ T.onCost }}\" style=\"min-height:46px;font-size:15px;background:var(--color-bg);border-color:var(--color-neutral-500)\"><option value=\"0\">0.5% per buy and sale<\u002Foption><option value=\"1\">1% per buy and sale<\u002Foption><\u002Fsc-raw-select><\u002Fdiv>\n                  <\u002Fdiv>\n                  <span style=\"font-size:14px;color:var(--color-neutral-800)\">Timing follows the rule: checks on completed five-minute UTC intervals with an assumed 3-minute data delay. Missing prices skip a trade rather than counting as zero.<\u002Fspan>\n                  <div style=\"display:flex;gap:10px;flex-wrap:wrap\"><button type=\"submit\" class=\"btn btn-primary\">Adopt settings and run example test<\u002Fbutton><\u002Fdiv>\n                <\u002Fform>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ T.unavailable }}\">\n                <div role=\"status\" style=\"display:flex;flex-direction:column;gap:10px;padding:20px 22px;border-radius:24px;border:2px solid var(--color-neutral-600);background:var(--color-neutral-100)\">\n                  <strong style=\"font-size:17px\">This test can’t run<\u002Fstrong>\n                  <span style=\"font-size:15px\">Past prices for the chosen period have gaps longer than the rule allows: 41 five-minute intervals are missing. Your rule, settings and agent are unchanged.<\u002Fspan>\n                  <span style=\"font-size:15px\">You can try another period, or skip testing. Testing isn’t required before trading, and an unavailable test doesn’t block it.<\u002Fspan>\n                  <button type=\"button\" class=\"btn btn-secondary\" sc-camel-on-click=\"{{ T.back }}\" style=\"align-self:flex-start\">Change settings<\u002Fbutton>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ T.result }}\">\n                <div style=\"display:flex;flex-direction:column;gap:16px;padding:20px 22px;border-radius:26px;background:var(--color-neutral-100);border:1px solid var(--color-divider)\">\n                  <span class=\"tag tag-accent\" style=\"align-self:flex-start;border:1px solid var(--color-accent-700)\">Authored example result · no simulator ran<\u002Fspan>\n                  <h3 style=\"margin:0;font-size:18px\">{{ T.heading }}<\u002Fh3>\n                  <dl style=\"margin:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px\">\n                    <sc-for list=\"{{ T.facts }}\" as=\"tf\"><div style=\"display:flex;flex-direction:column;gap:2px;padding:12px 14px;border-radius:18px;background:var(--color-bg)\"><dt style=\"font-size:13px;color:var(--color-neutral-800)\">{{ tf.k }}<\u002Fdt><dd style=\"margin:0;font-size:18px;font-weight:700\">{{ tf.v }}<\u002Fdd><\u002Fdiv><\u002Fsc-for>\n                  <\u002Fdl>\n                  <figure style=\"margin:0;display:flex;flex-direction:column;gap:6px\">\n                    <figcaption style=\"margin:0;font-size:14px;font-weight:700;color:var(--color-text)\">Simulated account balance (WMON) · high {{ T.mx }} · low {{ T.mn }}<\u002Ffigcaption>\n                    <svg sc-camel-view-box=\"0 0 600 200\" role=\"img\" aria-label=\"{{ T.chartLabel }}\" style=\"width:100%;height:auto;background:var(--color-bg);border-radius:18px\"><line x1=\"20\" y1=\"30\" x2=\"580\" y2=\"30\" stroke=\"var(--color-neutral-400)\" stroke-width=\"1\"><\u002Fline><line x1=\"20\" y1=\"180\" x2=\"580\" y2=\"180\" stroke=\"var(--color-neutral-400)\" stroke-width=\"1\"><\u002Fline><polyline points=\"{{ T.pts }}\" fill=\"none\" stroke=\"var(--color-accent-2-700)\" stroke-width=\"4\" stroke-linejoin=\"round\" stroke-linecap=\"round\"><\u002Fpolyline><\u002Fsvg>\n                  <\u002Ffigure>\n                  <div style=\"display:flex;flex-direction:column;gap:0;border:1px solid var(--color-neutral-400);border-radius:18px;overflow:hidden\">\n                    <sc-for list=\"{{ T.trades }}\" as=\"tt\" hint-placeholder-count=\"3\"><div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:4px 12px;padding:10px 14px;border-bottom:1px solid var(--color-divider);font-size:14px\"><span><span style=\"display:block;font-size:12px;color:var(--color-neutral-800)\">Trade<\u002Fspan>{{ tt.n }}<\u002Fspan><span><span style=\"display:block;font-size:12px;color:var(--color-neutral-800)\">Bought (WMON)<\u002Fspan>{{ tt.buy }}<\u002Fspan><span><span style=\"display:block;font-size:12px;color:var(--color-neutral-800)\">Sold before fee<\u002Fspan>{{ tt.gross }}<\u002Fspan><span><span style=\"display:block;font-size:12px;color:var(--color-neutral-800)\">Sale fee<\u002Fspan>{{ tt.fee }}<\u002Fspan><span><span style=\"display:block;font-size:12px;color:var(--color-neutral-800)\">Gain or loss<\u002Fspan>{{ tt.gain }}<\u002Fspan><span><span style=\"display:block;font-size:12px;color:var(--color-neutral-800)\">Balance after<\u002Fspan>{{ tt.bal }}<\u002Fspan><\u002Fdiv><\u002Fsc-for>\n                  <\u002Fdiv>\n                  <span style=\"font-size:14px\">Assumptions: {{ T.assume }} A favorable example doesn’t show the rule is profitable, and an unfavorable one doesn’t ban it.<\u002Fspan>\n                  <div style=\"display:flex;gap:10px;flex-wrap:wrap\"><button type=\"button\" class=\"btn btn-primary\" sc-camel-on-click=\"{{ T.save }}\">{{ T.saveLabel }}<\u002Fbutton><button type=\"button\" class=\"btn btn-secondary\" sc-camel-on-click=\"{{ T.back }}\">Change settings<\u002Fbutton><\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n              <div style=\"display:flex;flex-direction:column;gap:8px\"><h3 style=\"margin:0;font-size:18px\">Saved test results<\u002Fh3><sc-if value=\"{{ T.noSaved }}\"><span style=\"font-size:15px;color:var(--color-neutral-800)\">None saved for this agent.<\u002Fspan><\u002Fsc-if><sc-for list=\"{{ T.saved }}\" as=\"ts\"><button type=\"button\" class=\"btn btn-secondary\" sc-camel-on-click=\"{{ ts.onClick }}\" style=\"justify-content:flex-start;align-self:flex-start;text-align:left\">{{ ts.label }}<\u002Fbutton><\u002Fsc-for><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ AD.mem }}\">\n            <div style=\"display:flex;flex-direction:column;gap:16px\">\n              <div style=\"display:flex;flex-direction:column;gap:4px\"><strong style=\"font-size:17px\">{{ MEM.title }}<\u002Fstrong><span style=\"font-size:15px\">Given to {{ AD.name }} at the start of each task, with its version recorded. Memory can’t change rules, permission or balances, and other agents can’t read it.<\u002Fspan><\u002Fdiv>\n              <div style=\"display:flex;gap:10px;flex-wrap:wrap\"><button type=\"button\" class=\"btn btn-secondary\" sc-camel-on-click=\"{{ MEM.onToggle }}\" aria-pressed=\"{{ MEM.onStr }}\">{{ MEM.toggleLabel }}<\u002Fbutton><button type=\"button\" class=\"btn btn-ghost\" sc-camel-on-click=\"{{ MEM.onClear }}\" disabled=\"{{ MEM.empty }}\">Clear memory<\u002Fbutton><\u002Fdiv>\n              <sc-if value=\"{{ MEM.clearing }}\"><div role=\"alert\" style=\"display:flex;flex-direction:column;gap:10px;padding:16px 20px;border-radius:22px;border:2px solid var(--color-accent-700);background:var(--color-accent-100)\"><strong>Clear {{ AD.name }}’s memory?<\u002Fstrong><span style=\"font-size:15px\">Future tasks won’t recall these notes. Trading history, positions and pending records stay. Context already given to a running task can’t be promised erased.<\u002Fspan><div style=\"display:flex;gap:10px;flex-wrap:wrap\"><button type=\"button\" class=\"btn btn-primary\" sc-camel-on-click=\"{{ MEM.confirmClear }}\">Clear memory<\u002Fbutton><button type=\"button\" class=\"btn btn-secondary\" sc-camel-on-click=\"{{ MEM.cancelClear }}\">Cancel<\u002Fbutton><\u002Fdiv><\u002Fdiv><\u002Fsc-if>\n              <sc-if value=\"{{ MEM.empty }}\"><span style=\"font-size:15px;color:var(--color-neutral-800)\">No saved notes. Suggestions will appear here for you to adopt or ignore.<\u002Fspan><\u002Fsc-if>\n              <sc-for list=\"{{ MEM.items }}\" as=\"mm\" hint-placeholder-count=\"3\">\n                <div style=\"display:flex;flex-direction:column;gap:8px;padding:14px 18px;border-radius:22px;background:var(--color-neutral-100);border:1px solid var(--color-divider);opacity:{{ MEM.opacity }}\">\n                  <div style=\"display:flex;gap:8px;flex-wrap:wrap;align-items:center\"><span class=\"tag tag-neutral\" style=\"border:1px solid var(--color-neutral-500)\">{{ mm.kind }}<\u002Fspan><span class=\"tag {{ mm.cls }}\">{{ mm.status }}<\u002Fspan><span style=\"font-size:13px;color:var(--color-neutral-800)\">{{ mm.source }}<\u002Fspan><\u002Fdiv>\n                  <sc-if value=\"{{ mm.notEditing }}\"><span style=\"font-size:15px\">{{ mm.text }}<\u002Fspan><\u002Fsc-if>\n                  <sc-if value=\"{{ mm.editing }}\"><label for=\"mem-edit\" style=\"font-size:13px;font-weight:700\">Correct this note<\u002Flabel><input id=\"mem-edit\" class=\"input\" value=\"{{ mm.editText }}\" sc-camel-on-change=\"{{ mm.onEditText }}\" style=\"min-height:44px;font-size:15px;background:var(--color-bg);border-color:var(--color-neutral-500)\"><\u002Fsc-if>\n                  <div style=\"display:flex;gap:6px;flex-wrap:wrap\">\n                    <sc-if value=\"{{ mm.isSuggested }}\"><button type=\"button\" class=\"btn btn-secondary\" sc-camel-on-click=\"{{ mm.onAdopt }}\" style=\"font-size:14px\">Adopt<\u002Fbutton><\u002Fsc-if>\n                    <sc-if value=\"{{ mm.notEditing }}\"><button type=\"button\" class=\"btn btn-ghost\" sc-camel-on-click=\"{{ mm.onEdit }}\" style=\"font-size:14px\">Correct<\u002Fbutton><\u002Fsc-if>\n                    <sc-if value=\"{{ mm.editing }}\"><button type=\"button\" class=\"btn btn-secondary\" sc-camel-on-click=\"{{ mm.onSave }}\" style=\"font-size:14px\">Save correction<\u002Fbutton><\u002Fsc-if>\n                    <button type=\"button\" class=\"btn btn-ghost\" sc-camel-on-click=\"{{ mm.onRemove }}\" style=\"font-size:14px\">Remove<\u002Fbutton>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ AD.add }}\">\n            <div style=\"display:flex;flex-direction:column;gap:12px\">\n              <p style=\"margin:0;font-size:15px\">Reviewed add-ons give {{ AD.name }} read-only abilities or instructions. None can sign, spend or move funds. You can’t install your own files or links.<\u002Fp>\n              <sc-for list=\"{{ ADD }}\" as=\"ad\" hint-placeholder-count=\"4\">\n                <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px 18px;padding:16px 20px;border-radius:22px;background:var(--color-neutral-100);border:1px solid var(--color-divider)\">\n                  <span style=\"grid-column:1 / -1;display:flex;gap:8px 12px;flex-wrap:wrap;align-items:center\"><strong style=\"font-size:16px\">{{ ad.name }}<\u002Fstrong><span class=\"tag {{ ad.cls }}\">{{ ad.availText }}<\u002Fspan><\u002Fspan>\n                  <span style=\"font-size:14px;grid-column:1 / -1\">{{ ad.access }}<\u002Fspan>\n                  <span style=\"font-size:13px\"><span style=\"display:block;color:var(--color-neutral-800)\">Type<\u002Fspan>{{ ad.type }}<\u002Fspan>\n                  <span style=\"font-size:13px\"><span style=\"display:block;color:var(--color-neutral-800)\">Version<\u002Fspan>{{ ad.version }}<\u002Fspan>\n                  <span style=\"font-size:13px\"><span style=\"display:block;color:var(--color-neutral-800)\">Cost<\u002Fspan>{{ ad.cost }}<\u002Fspan>\n                  <sc-if value=\"{{ ad.ready }}\"><button type=\"button\" class=\"btn btn-secondary\" sc-camel-on-click=\"{{ ad.onToggle }}\" aria-pressed=\"{{ ad.onStr }}\" style=\"justify-self:start\">{{ ad.btn }}<\u002Fbutton><\u002Fsc-if>\n                  <sc-if value=\"{{ ad.notReady }}\"><span style=\"font-size:14px;font-weight:600;align-self:center\">Planned · not available<\u002Fspan><\u002Fsc-if>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ PL.show }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"max-width:900px;display:flex;flex-direction:column;gap:20px\">\n          <div style=\"display:flex;flex-direction:column;gap:6px\">\n            <h2 id=\"page-title\" tabindex=\"-1\" style=\"margin:0;font-size:30px\">Positions<\u002Fh2>\n            <p style=\"margin:0;font-size:16px;color:var(--color-neutral-800);max-width:660px\">Every position belongs to one agent and its wallet. Positions in the same token stay separate and are never pooled.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end\">\n            <div style=\"display:flex;flex-direction:column;gap:6px;min-width:180px\"><label for=\"pf-agent\" style=\"font-size:14px;font-weight:700\">Agent and wallet<\u002Flabel><sc-raw-select id=\"pf-agent\" class=\"input\" value=\"{{ PL.agent }}\" sc-camel-on-change=\"{{ PL.onAgent }}\" style=\"min-height:46px;font-size:15px;background:var(--color-neutral-100);border-color:var(--color-neutral-500)\"><sc-for list=\"{{ PL.agentOpts }}\" as=\"ao\"><option value=\"{{ ao.v }}\">{{ ao.label }}<\u002Foption><\u002Fsc-for><\u002Fsc-raw-select><\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:6px;min-width:160px\"><label for=\"pf-token\" style=\"font-size:14px;font-weight:700\">Token<\u002Flabel><input id=\"pf-token\" class=\"input\" value=\"{{ PL.search }}\" sc-camel-on-change=\"{{ PL.onSearch }}\" placeholder=\"Search, e.g. MOE\" style=\"min-height:46px;font-size:15px;background:var(--color-neutral-100);border-color:var(--color-neutral-500)\"><\u002Fdiv>\n            <div role=\"group\" aria-label=\"Position status\" style=\"display:flex;gap:4px;padding:4px;border-radius:999px;background:var(--color-surface)\"><sc-for list=\"{{ PL.statusTabs }}\" as=\"sx\"><button type=\"button\" aria-pressed=\"{{ sx.pressed }}\" sc-camel-on-click=\"{{ sx.onClick }}\" style=\"min-height:40px;padding:6px 16px;border-radius:999px;border:0;background:{{ sx.bg }};font-family:var(--font-body);font-size:14px;font-weight:{{ sx.fw }};color:var(--color-text);cursor:pointer\">{{ sx.label }}<\u002Fbutton><\u002Fsc-for><\u002Fdiv>\n          <\u002Fdiv>\n          <sc-if value=\"{{ LD.loading }}\"><div role=\"status\" style=\"display:flex;flex-direction:column;gap:10px;padding:20px;border-radius:24px;background:var(--color-neutral-100)\"><span style=\"font-size:15px\">Loading positions. No amounts are shown until records arrive.<\u002Fspan><div aria-hidden=\"true\" style=\"height:52px;border-radius:18px;background:var(--color-neutral-300)\"><\u002Fdiv><div aria-hidden=\"true\" style=\"height:52px;border-radius:18px;background:var(--color-neutral-300)\"><\u002Fdiv><\u002Fdiv><\u002Fsc-if>\n          <sc-if value=\"{{ LD.error }}\"><div role=\"alert\" style=\"display:flex;flex-direction:column;gap:10px;padding:20px 22px;border-radius:24px;border:2px solid var(--color-accent-700);background:var(--color-accent-100)\"><strong style=\"font-size:16px\">Positions couldn’t be loaded<\u002Fstrong><span style=\"font-size:15px\">This is a display problem. Your positions and pending actions aren’t changed by it. Nothing is shown rather than a guessed amount.<\u002Fspan><button type=\"button\" class=\"btn btn-primary\" sc-camel-on-click=\"{{ LD.retry }}\" style=\"align-self:flex-start\">Try again<\u002Fbutton><\u002Fdiv><\u002Fsc-if>\n          <sc-if value=\"{{ LD.stale }}\"><p role=\"status\" style=\"margin:0;padding:12px 16px;border-radius:18px;background:var(--color-accent-100);color:var(--color-accent-900);font-size:15px;font-weight:600\">Prices are 2 hours old. Value estimates below use the last known price and may be out of date.<\u002Fp><\u002Fsc-if>\n          <sc-if value=\"{{ LD.ok }}\">\n            <sc-if value=\"{{ PL.sameToken }}\"><p style=\"margin:0;font-size:14px;color:var(--color-neutral-800)\">{{ PL.sameToken }}<\u002Fp><\u002Fsc-if>\n            <div style=\"display:flex;flex-direction:column;gap:10px\">\n              <sc-for list=\"{{ PL.rows }}\" as=\"pp\" hint-placeholder-count=\"3\">\n                <button type=\"button\" sc-camel-on-click=\"{{ pp.onClick }}\" style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px 18px;text-align:left;padding:16px 20px;border-radius:24px;border:1px solid var(--color-neutral-400);background:var(--color-neutral-100);font-family:var(--font-body);color:var(--color-text);cursor:pointer\" style-hover=\"border-color:var(--color-accent-700)\">\n                  <span style=\"grid-column:1 / -1;display:flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline\"><strong style=\"font-size:17px\">{{ pp.title }}<\u002Fstrong><span style=\"font-size:13px;color:var(--color-neutral-800)\">{{ pp.wallet }}<\u002Fspan><\u002Fspan>\n                  <span style=\"display:flex;flex-direction:column\"><span style=\"font-size:12px;color:var(--color-neutral-800)\">Quantity<\u002Fspan><span style=\"font-size:15px;font-weight:700\">{{ pp.qty }}<\u002Fspan><\u002Fspan>\n                  <span style=\"display:flex;flex-direction:column\"><span style=\"font-size:12px;color:var(--color-neutral-800)\">Cost<\u002Fspan><span style=\"font-size:15px;font-weight:700\">{{ pp.cost }}<\u002Fspan><\u002Fspan>\n                  <span style=\"display:flex;flex-direction:column\"><span style=\"font-size:12px;color:var(--color-neutral-800)\">{{ pp.valueLabel }}<\u002Fspan><span style=\"font-size:15px;font-weight:700\">{{ pp.value }}<\u002Fspan><\u002Fspan>\n                  <span style=\"display:flex;flex-direction:column\"><span style=\"font-size:12px;color:var(--color-neutral-800)\">Result<\u002Fspan><span style=\"font-size:15px;font-weight:700\">{{ pp.result }}<\u002Fspan><\u002Fspan>\n                  <span style=\"display:flex;flex-direction:column\"><span style=\"font-size:12px;color:var(--color-neutral-800)\">Action<\u002Fspan><span style=\"font-size:15px;font-weight:700\">{{ pp.action }}<\u002Fspan><\u002Fspan>\n                <\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <sc-if value=\"{{ PL.emptyAll }}\"><div style=\"padding:22px 24px;border-radius:26px;border:1px dashed var(--color-neutral-600);display:flex;flex-direction:column;gap:8px\"><strong style=\"font-size:17px\">No positions<\u002Fstrong><span style=\"font-size:15px\">Agents open positions only after you fund them and approve their trading permission.<\u002Fspan><button type=\"button\" class=\"btn btn-secondary\" sc-camel-on-click=\"{{ PL.toAgents }}\" style=\"align-self:flex-start\">Go to Agents<\u002Fbutton><\u002Fdiv><\u002Fsc-if>\n            <sc-if value=\"{{ PL.emptyFiltered }}\"><div style=\"padding:18px 22px;border-radius:24px;background:var(--color-neutral-100);display:flex;flex-direction:column;gap:8px\"><strong style=\"font-size:16px\">Nothing matches these filters<\u002Fstrong><span style=\"font-size:15px\">Other positions exist. Change the filters to see them.<\u002Fspan><button type=\"button\" class=\"btn btn-secondary\" sc-camel-on-click=\"{{ PL.clear }}\" style=\"align-self:flex-start\">Show all positions<\u002Fbutton><\u002Fdiv><\u002Fsc-if>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ PD.show }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"max-width:860px;display:flex;flex-direction:column;gap:20px\">\n          <div style=\"display:flex;flex-direction:column;gap:6px\">\n            <span class=\"tag {{ PD.statusCls }}\" style=\"align-self:flex-start\">{{ PD.status }}<\u002Fspan>\n            <h2 id=\"page-title\" tabindex=\"-1\" style=\"margin:0;font-size:28px\">{{ PD.title }}<\u002Fh2>\n            <p style=\"margin:0;font-size:15px;color:var(--color-neutral-800)\">Owned by {{ PD.owner }}<\u002Fp>\n          <\u002Fdiv>\n          <dl style=\"margin:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));border:1px solid var(--color-neutral-400);border-radius:22px;overflow:hidden;background:var(--color-neutral-100)\">\n            <sc-for list=\"{{ PD.facts }}\" as=\"pf\" hint-placeholder-count=\"6\"><div style=\"padding:12px 16px;display:flex;flex-direction:column;gap:2px;border-bottom:1px solid var(--color-divider)\"><dt style=\"font-size:13px;color:var(--color-neutral-800)\">{{ pf.k }}<\u002Fdt><dd style=\"margin:0;font-size:15px;font-weight:700\">{{ pf.v }}<\u002Fdd><\u002Fdiv><\u002Fsc-for>\n          <\u002Fdl>\n          <section style=\"display:flex;flex-direction:column;gap:10px\">\n            <h3 style=\"margin:0;font-size:18px\">Actions on this position<\u002Fh3>\n            <sc-if value=\"{{ PD.noActions }}\"><span style=\"font-size:15px;color:var(--color-neutral-800)\">None in progress.<\u002Fspan><\u002Fsc-if>\n            <sc-for list=\"{{ PD.actions }}\" as=\"pa\"><div style=\"display:flex;flex-direction:column;gap:6px;padding:14px 18px;border-radius:20px;background:var(--color-neutral-100);border:2px solid {{ pa.border }}\"><div style=\"display:flex;gap:8px;align-items:center;flex-wrap:wrap\"><strong style=\"font-size:15px\">{{ pa.title }}<\u002Fstrong><span class=\"tag {{ pa.cls }}\">{{ pa.status }}<\u002Fspan><\u002Fdiv><span style=\"font-size:14px\">{{ pa.text }}<\u002Fspan><span style=\"font-size:13px;color:var(--color-neutral-800)\">{{ pa.timeline }}<\u002Fspan><sc-if value=\"{{ pa.canCancel }}\"><button type=\"button\" class=\"btn btn-secondary\" sc-camel-on-click=\"{{ pa.onCancel }}\" style=\"align-self:flex-start;font-size:14px\">Cancel before sending<\u002Fbutton><\u002Fsc-if><sc-if value=\"{{ pa.canPrepare }}\"><button type=\"button\" class=\"btn btn-primary\" sc-camel-on-click=\"{{ pa.onPrepare }}\" style=\"align-self:flex-start;font-size:14px\">Prepare again with current prices<\u002Fbutton><\u002Fsc-if><\u002Fdiv><\u002Fsc-for>\n          <\u002Fsection>\n          <sc-if value=\"{{ PD.open }}\">\n            <section style=\"display:flex;flex-direction:column;gap:10px;padding:18px 22px;border-radius:24px;background:var(--color-surface)\">\n              <div style=\"display:flex;gap:10px;flex-wrap:wrap\"><button type=\"button\" class=\"btn btn-primary\" sc-camel-on-click=\"{{ PD.sellHalf }}\">Review selling half<\u002Fbutton><button type=\"button\" class=\"btn btn-secondary\" sc-camel-on-click=\"{{ PD.sellAll }}\">Review selling all<\u002Fbutton><button type=\"button\" class=\"btn btn-secondary\" sc-camel-on-click=\"{{ PD.withdraw }}\">Withdraw tokens to my wallet<\u002Fbutton><button type=\"button\" class=\"btn btn-secondary\" sc-camel-on-click=\"{{ PD.onStop }}\">{{ PD.stopLabel }}<\u002Fbutton><button type=\"button\" class=\"btn btn-ghost\" sc-camel-on-click=\"{{ MC.toggle }}\" aria-expanded=\"{{ MC.openStr }}\">View market chart<\u002Fbutton><\u002Fdiv>\n              <sc-if value=\"{{ MC.open }}\"><section aria-label=\"Market chart\" style=\"display:flex;flex-direction:column;gap:10px;padding:18px 22px;border-radius:24px;border:1px solid var(--color-neutral-500);background:var(--color-neutral-100)\">\n              <div style=\"display:flex;gap:8px 12px;align-items:baseline;flex-wrap:wrap\"><h3 style=\"margin:0;font-size:17px;font-family:var(--font-body);font-weight:700\">Market chart · external<\u002Fh3><span class=\"tag {{ MC.cls }}\">{{ MC.state }}<\u002Fspan><\u002Fdiv>\n              <dl style=\"margin:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px 16px;font-size:14px\"><sc-for list=\"{{ MC.rows }}\" as=\"mcr\"><div><dt style=\"font-size:13px;color:var(--color-neutral-800)\">{{ mcr.k }}<\u002Fdt><dd style=\"margin:0;font-weight:600\">{{ mcr.v }}<\u002Fdd><\u002Fdiv><\u002Fsc-for><\u002Fdl>\n              <p style=\"margin:0;font-size:14px\">{{ MC.text }}<\u002Fp>\n              <sc-if value=\"{{ MC.available }}\"><button type=\"button\" class=\"btn btn-secondary\" sc-camel-on-click=\"{{ MC.onOpen }}\" style=\"align-self:flex-start\">{{ MC.openLabel }}<\u002Fbutton><\u002Fsc-if>\n            <\u002Fsection><\u002Fsc-if>\n              <span style=\"font-size:14px\">Selling half leaves the rest in this position; selling all closes it. Neither stops {{ PD.agentName }} from buying MOE again when its rule matches. Withdrawing moves tokens to your wallet without selling them. A position stop affects only this position.<\u002Fspan>\n            <\u002Fsection>\n          <\u002Fsc-if>\n          <details open=\"{{ PD.histOpen }}\" style=\"border-top:1px solid var(--color-divider);padding-top:12px\"><summary style=\"font-size:16px;font-weight:700\">Position history<\u002Fsummary><ol style=\"margin:10px 0 0;padding-left:22px;display:flex;flex-direction:column;gap:6px;font-size:14px\"><sc-for list=\"{{ PD.history }}\" as=\"ph\"><li>{{ ph.t }}<\u002Fli><\u002Fsc-for><\u002Fol><\u002Fdetails>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ FU.show }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"max-width:900px;display:flex;flex-direction:column;gap:22px\">\n          <div style=\"display:flex;flex-direction:column;gap:6px\">\n            <h2 id=\"page-title\" tabindex=\"-1\" style=\"margin:0;font-size:30px\">Funds<\u002Fh2>\n            <p style=\"margin:0;font-size:16px;color:var(--color-neutral-800);max-width:680px\">Your wallet and each agent wallet are separate. There’s no pooled Edge OS balance. Moving money between them never starts trading or changes permission.<\u002Fp>\n          <\u002Fdiv>\n          <sc-if value=\"{{ LD.loading }}\"><div role=\"status\" style=\"padding:20px;border-radius:24px;background:var(--color-neutral-100);font-size:15px\">Loading balances. No amounts are shown until records arrive.<\u002Fdiv><\u002Fsc-if>\n          <sc-if value=\"{{ LD.error }}\"><div role=\"alert\" style=\"display:flex;flex-direction:column;gap:10px;padding:20px 22px;border-radius:24px;border:2px solid var(--color-accent-700);background:var(--color-accent-100)\"><strong style=\"font-size:16px\">Balances couldn’t be loaded<\u002Fstrong><span style=\"font-size:15px\">Nothing is shown rather than a guessed amount. Pending transfers aren’t affected.<\u002Fspan><button type=\"button\" class=\"btn btn-primary\" sc-camel-on-click=\"{{ LD.retry }}\" style=\"align-self:flex-start\">Try again<\u002Fbutton><\u002Fdiv><\u002Fsc-if>\n          <sc-if value=\"{{ LD.stale }}\"><p role=\"status\" style=\"margin:0;padding:12px 16px;border-radius:18px;background:var(--color-accent-100);color:var(--color-accent-900);font-size:15px;font-weight:600\">Balances were last updated 2 hours ago and may be out of date.<\u002Fp><\u002Fsc-if>\n          <sc-if value=\"{{ LD.ok }}\">\n            <sc-if value=\"{{ FU.hasForm }}\">\n              <form sc-camel-on-submit=\"{{ FU.preview }}\" style=\"display:flex;flex-direction:column;gap:14px;padding:20px 22px;border-radius:26px;border:2px solid var(--color-accent-500);background:var(--color-neutral-100)\">\n                <h3 style=\"margin:0;font-size:19px\">{{ FU.formTitle }}<\u002Fh3>\n                <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px\">\n                  <div style=\"display:flex;flex-direction:column;gap:6px\"><label for=\"ff-agent\" style=\"font-size:14px;font-weight:700\">{{ FU.agentLabel }}<\u002Flabel><sc-raw-select id=\"ff-agent\" class=\"input\" value=\"{{ FU.agent }}\" sc-camel-on-change=\"{{ FU.onAgent }}\" style=\"min-height:46px;font-size:15px;background:var(--color-bg);border-color:var(--color-neutral-500)\"><sc-for list=\"{{ FU.agentOpts }}\" as=\"fo\"><option value=\"{{ fo.v }}\">{{ fo.label }}<\u002Foption><\u002Fsc-for><\u002Fsc-raw-select><\u002Fdiv>\n                  <div style=\"display:flex;flex-direction:column;gap:6px\"><label for=\"ff-asset\" style=\"font-size:14px;font-weight:700\">Token<\u002Flabel><sc-raw-select id=\"ff-asset\" class=\"input\" value=\"{{ FU.asset }}\" sc-camel-on-change=\"{{ FU.onAsset }}\" style=\"min-height:46px;font-size:15px;background:var(--color-bg);border-color:var(--color-neutral-500)\"><sc-for list=\"{{ FU.assetOpts }}\" as=\"fa2\"><option value=\"{{ fa2.v }}\">{{ fa2.label }}<\u002Foption><\u002Fsc-for><\u002Fsc-raw-select><\u002Fdiv>\n                  <sc-if value=\"{{ FU.needPos }}\"><div style=\"display:flex;flex-direction:column;gap:6px\"><label for=\"ff-pos\" style=\"font-size:14px;font-weight:700\">From position<\u002Flabel><sc-raw-select id=\"ff-pos\" class=\"input\" value=\"{{ FU.pos }}\" sc-camel-on-change=\"{{ FU.onPos }}\" style=\"min-height:46px;font-size:15px;background:var(--color-bg);border-color:var(--color-neutral-500)\"><sc-for list=\"{{ FU.posOpts }}\" as=\"fp\"><option value=\"{{ fp.v }}\">{{ fp.label }}<\u002Foption><\u002Fsc-for><\u002Fsc-raw-select><\u002Fdiv><\u002Fsc-if>\n                  <div style=\"display:flex;flex-direction:column;gap:6px\"><label for=\"ff-amt\" style=\"font-size:14px;font-weight:700\">Exact amount<\u002Flabel><input id=\"ff-amt\" type=\"number\" min=\"0\" step=\"any\" class=\"input\" value=\"{{ FU.amount }}\" sc-camel-on-change=\"{{ FU.onAmount }}\" placeholder=\"0\" style=\"min-height:46px;font-size:15px;background:var(--color-bg);border-color:var(--color-neutral-500)\"><\u002Fdiv>\n                <\u002Fdiv>\n                <span style=\"font-size:14px\">{{ FU.availLine }}<\u002Fspan>\n                <sc-if value=\"{{ FU.hasErr }}\"><span role=\"alert\" style=\"font-size:14px;font-weight:700;color:var(--color-accent-800)\">{{ FU.err }}<\u002Fspan><\u002Fsc-if>\n                <div style=\"display:flex;gap:10px;flex-wrap:wrap\"><button type=\"submit\" class=\"btn btn-primary\">Review transfer<\u002Fbutton><button type=\"button\" class=\"btn btn-secondary\" sc-camel-on-click=\"{{ FU.cancel }}\">Cancel<\u002Fbutton><\u002Fdiv>\n              <\u002Fform>\n            <\u002Fsc-if>\n            <section style=\"display:flex;flex-direction:column;gap:10px;padding:20px 22px;border-radius:26px;background:var(--color-surface)\">\n              <div style=\"display:flex;gap:8px 14px;flex-wrap:wrap;align-items:baseline\"><h3 style=\"margin:0;font-size:19px\">Your wallet<\u002Fh3><span style=\"font-size:13px\">DEMO-PERSONAL-001 · Monad · connected<\u002Fspan><\u002Fdiv>\n              <dl style=\"margin:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px\"><sc-for list=\"{{ FU.personal }}\" as=\"pw\"><div><dt style=\"font-size:13px;color:var(--color-neutral-800)\">{{ pw.k }}<\u002Fdt><dd style=\"margin:0;font-size:17px;font-weight:700\">{{ pw.v }}<\u002Fdd><\u002Fdiv><\u002Fsc-for><\u002Fdl>\n              <span style=\"font-size:13px\">Edge OS never moves money from your wallet without your signature on each transfer.<\u002Fspan>\n            <\u002Fsection>\n            <h3 style=\"margin:0;font-size:20px\">Agent wallets<\u002Fh3>\n            <sc-if value=\"{{ FU.noAgents }}\"><div style=\"padding:20px 22px;border-radius:24px;border:1px dashed var(--color-neutral-600);display:flex;flex-direction:column;gap:8px\"><strong style=\"font-size:16px\">No agent wallets yet<\u002Fstrong><span style=\"font-size:15px\">Each agent gets its own wallet when you create it in Agents.<\u002Fspan><button type=\"button\" class=\"btn btn-secondary\" sc-camel-on-click=\"{{ PL.toAgents }}\" style=\"align-self:flex-start\">Go to Agents<\u002Fbutton><\u002Fdiv><\u002Fsc-if>\n            <sc-for list=\"{{ FU.wallets }}\" as=\"aw\" hint-placeholder-count=\"3\">\n              <section style=\"display:flex;flex-direction:column;gap:10px;padding:18px 22px;border-radius:24px;background:var(--color-neutral-100);border:1px solid var(--color-divider)\">\n                <div style=\"display:flex;gap:8px 14px;flex-wrap:wrap;align-items:baseline\"><strong style=\"font-size:17px\">{{ aw.name }} wallet<\u002Fstrong><span style=\"font-size:13px;color:var(--color-neutral-800)\">{{ aw.address }} · Monad · {{ aw.setup }}<\u002Fspan><\u002Fdiv>\n                <dl style=\"margin:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px\"><sc-for list=\"{{ aw.rows }}\" as=\"awr\"><div><dt style=\"font-size:13px;color:var(--color-neutral-800)\">{{ awr.k }}<\u002Fdt><dd style=\"margin:0;font-size:15px;font-weight:700\">{{ awr.v }}<\u002Fdd><\u002Fdiv><\u002Fsc-for><\u002Fdl>\n                <div style=\"display:flex;gap:8px;flex-wrap:wrap\"><button type=\"button\" class=\"btn btn-secondary\" sc-camel-on-click=\"{{ aw.onFund }}\" disabled=\"{{ aw.notReady }}\">Add funds<\u002Fbutton><button type=\"button\" class=\"btn btn-secondary\" sc-camel-on-click=\"{{ aw.onWithdraw }}\" disabled=\"{{ aw.notReady }}\">Withdraw to my wallet<\u002Fbutton><\u002Fdiv>\n              <\u002Fsection>\n            <\u002Fsc-for>\n            <section style=\"display:flex;flex-direction:column;gap:10px\">\n              <h3 style=\"margin:0;font-size:20px\">Transfers and trades<\u002Fh3>\n              <sc-if value=\"{{ FU.noActivity }}\"><span style=\"font-size:15px;color:var(--color-neutral-800)\">No transfers yet.<\u002Fspan><\u002Fsc-if>\n              <sc-for list=\"{{ FU.activity }}\" as=\"ac\"><div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:4px 16px;padding:12px 16px;border-radius:18px;background:var(--color-neutral-100);border:1px solid var(--color-divider);font-size:14px\"><span style=\"grid-column:1 / -1;display:flex;gap:8px;flex-wrap:wrap;align-items:center\"><strong style=\"font-size:15px\">{{ ac.title }}<\u002Fstrong><span class=\"tag {{ ac.cls }}\">{{ ac.status }}<\u002Fspan><\u002Fspan><span>{{ ac.route }}<\u002Fspan><span>{{ ac.fee }}<\u002Fspan><span>{{ ac.timeline }}<\u002Fspan><sc-if value=\"{{ ac.canCancel }}\"><button type=\"button\" class=\"btn btn-secondary\" sc-camel-on-click=\"{{ ac.onCancel }}\" style=\"font-size:13px;justify-self:start\">Cancel before sending<\u002Fbutton><\u002Fsc-if><\u002Fdiv><\u002Fsc-for>\n            <\u002Fsection>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fmain>\n\n    <sc-if value=\"{{ sheetScrim }}\"><div aria-hidden=\"true\" sc-camel-on-click=\"{{ closeChat }}\" style=\"position:absolute;inset:0;background:color-mix(in srgb, var(--color-neutral-900) 40%, transparent);z-index:4\"><\u002Fdiv><\u002Fsc-if>\n    <sc-if value=\"{{ chatShown }}\" hint-placeholder-val=\"{{ true }}\">\n      <aside id=\"chat-panel\" aria-label=\"Conversation\" role=\"{{ chatRole }}\" aria-modal=\"{{ chatModal }}\" style=\"{{ L.chat }}\">\n        <sc-if value=\"{{ isMobile }}\"><div aria-hidden=\"true\" style=\"width:44px;height:5px;border-radius:999px;background:var(--color-neutral-500);align-self:center;margin-top:10px;flex:none\"><\u002Fdiv><\u002Fsc-if>\n        <div style=\"padding:16px 22px 14px;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid var(--color-divider);flex:none\">\n          <div style=\"display:flex;align-items:center;gap:10px\"><h3 style=\"margin:0;flex:1;font-size:20px\">Conversation<\u002Fh3><button type=\"button\" class=\"btn btn-ghost btn-icon\" aria-label=\"{{ closeChatLabel }}\" sc-camel-on-click=\"{{ closeChat }}\" style=\"width:44px;height:44px;color:var(--color-text)\"><svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M18 6 6 18\"><\u002Fpath><path d=\"m6 6 12 12\"><\u002Fpath><\u002Fsvg><\u002Fbutton><\u002Fdiv>\n
