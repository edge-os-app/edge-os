 <div style=\"display:flex;flex-direction:column;gap:2px;padding:12px 14px;border-radius:16px;background:var(--color-surface)\">\n            <span style=\"font-size:13px;color:var(--color-neutral-800)\">About<\u002Fspan>\n            <span style=\"font-size:15px;font-weight:700\">{{ cx.about }}<\u002Fspan>\n            <span style=\"font-size:13px;color:var(--color-neutral-800)\">{{ cx.sub }}<\u002Fspan>\n            <button type=\"button\" sc-camel-on-click=\"{{ cx.onReturn }}\" style=\"align-self:flex-start;background:none;border:0;padding:6px 0 0;font-family:var(--font-body);font-size:14px;color:var(--color-accent-700);text-decoration:underline;text-underline-offset:3px;cursor:pointer\">{{ cx.returnLabel }}<\u002Fbutton>\n          <\u002Fdiv>\n          <p style=\"margin:0;font-size:13px;color:var(--color-neutral-800)\">Replies read the same records as the pages. Asking never starts research or a trade; anything consequential opens a review first.<\u002Fp>\n        <\u002Fdiv>\n        <div aria-live=\"polite\" style=\"flex:1;min-height:0;overflow:auto;padding:18px 22px;display:flex;flex-direction:column;gap:16px\">\n          <sc-if value=\"{{ cx.empty }}\"><p style=\"margin:0;font-size:14px;color:var(--color-neutral-800)\">No messages about this record yet. Pick a question below or write your own.<\u002Fp><\u002Fsc-if>\n          <sc-for list=\"{{ cx.thread }}\" as=\"m\" hint-placeholder-count=\"0\">\n            <div style=\"display:flex;flex-direction:column;gap:8px\">\n              <div style=\"align-self:flex-end;max-width:86%;padding:10px 14px;border-radius:18px 18px 4px 18px;background:var(--color-surface);font-size:15px\">{{ m.q }}<\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:4px\"><span style=\"font-size:12px;font-weight:700;color:var(--color-neutral-800)\">Edge OS · example reply · {{ m.t }}<\u002Fspan><div style=\"font-size:15px;line-height:1.55;white-space:pre-line\">{{ m.a }}<\u002Fdiv><\u002Fdiv>\n              <sc-if value=\"{{ m.hasOpts }}\"><div style=\"display:flex;flex-direction:column;gap:6px\"><sc-for list=\"{{ m.opts }}\" as=\"mo\"><button type=\"button\" class=\"btn btn-secondary\" sc-camel-on-click=\"{{ mo.onClick }}\" style=\"justify-content:flex-start;text-align:left;font-size:14px\">{{ mo.label }}<\u002Fbutton><\u002Fsc-for><\u002Fdiv><\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"padding:12px 22px 18px;display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--color-divider);flex:none\">\n          <div style=\"{{ L.chips }}\">\n            <sc-for list=\"{{ cx.chips }}\" as=\"ch\" hint-placeholder-count=\"3\"><button type=\"button\" class=\"btn btn-secondary\" sc-camel-on-click=\"{{ ch.onClick }}\" style=\"font-size:13px;min-height:40px;padding:6px 12px;flex:none;white-space:nowrap\">{{ ch.label }}<\u002Fbutton><\u002Fsc-for>\n          <\u002Fdiv>\n          <form sc-camel-on-submit=\"{{ sendChat }}\" style=\"display:flex;gap:8px;align-items:center\">\n            <label for=\"chat-input\" style=\"position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)\">Message about {{ cx.about }}<\u002Flabel>\n            <input id=\"chat-input\" class=\"input\" value=\"{{ chatDraft }}\" sc-camel-on-change=\"{{ onChatDraft }}\" placeholder=\"Ask or answer here\" autocomplete=\"off\" style=\"min-height:46px;font-size:16px;background:var(--color-bg);border-color:var(--color-neutral-500)\">\n            <button type=\"submit\" class=\"btn btn-primary btn-icon\" aria-label=\"Send\" style=\"width:46px;height:46px;flex:none;padding:0;border-radius:999px\"><svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m5 12 7-7 7 7\"><\u002Fpath><path d=\"M12 19V5\"><\u002Fpath><\u002Fsvg><\u002Fbutton>\n          <\u002Fform>\n        <\u002Fdiv> ing(d.getUTCHours()).padStart(2, '0') + ':' + String(d.getUTCMinutes()).padStart(2, '0') + ' UTC';\n  }\n  static f(n, d) { return n === null || n === undefined || Number.isNaN(n) ? 'Unknown' : Number(n).toFixed(d === undefined ? 2 : d); }\n  static sg(n, d) { if (n === null || n === undefined) return 'Unknown'; const v = Number(n).toFixed(d === undefined ? 2 : d); return (n > 0 ? '+' : n < 0 ? '−' : '') + v.replace('-', ''); }\n  static has(t, ws) { const l = String(t || '').toLowerCase(); return ws.some(w => l.indexOf(w) > -1); }\n  static pend(a) { return a.status === 'Waiting' || a.status === 'Sent' || a.status === 'Unknown'; }\n  static clone(x) { return JSON.parse(JSON.stringify(x)); }\n\n  static RULES() {\n    const chk = 'Hourly at 10 minutes past the hour, on completed five-minute UTC intervals. Missing or old price data blocks trading.';\n    return {\n      A: { id:'A', title:'Buy after a price rise', entry:'Buy when MOE’s price rose by more than 1% over the last completed five-minute interval.', exit:'Sell each purchase 30 minutes later.', check:chk, additions:'Allowed on a new matching signal, within all limits.', origin:'Example rule', evidence:'Illustrative rule. No study supports it.', test:'ok', sizing:'Set by its permission: most per buy.', restrictions:'None stated.' },\n      B: { id:'B', title:'Buy after a price fall', entry:'Buy when MOE’s price fell by more than 1% over the last completed five-minute interval.', exit:'Sell each purchase 30 minutes later.', check:chk, additions:'No additional purchases while a position is open.', origin:'Example rule', evidence:'Illustrative rule. No study supports it.', test:'gaps', sizing:'Set by its permission: most per buy.', restrictions:'None stated.' }\n    };\n  }\n  static ADDONS = [\n    { id:'guide', name:'Price and volume investigation guide', type:'Instruction skill', version:'1.2', access:'Reads nothing by itself. Guides how the agent explains price and volume checks.', cost:'Included', avail:'Re
